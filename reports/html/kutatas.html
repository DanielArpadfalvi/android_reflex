<script type="text/markdown" id="md-top20"># Könyvelőirodák top 20 lista – első interjú- és pilotpartnerek (Szeged és Csongrád-Csanád vármegye)

*Állapot: 2026. október. Készült a Kft. értékesítő partnerének. Senkit nem kerestünk meg.*

## Bevezető

A lista két kutatási jegyzetből készült. Az egyik 31 szegedi, a másik 24 vármegyei könyvelőirodát vett számba (`research_notes/Könyvelőirodák Szegeden/prospects_szeged_city.md` és `prospects_county.md`). A célt az `AI üzleti lehetőségek Szegeden.md` jelentés adja: az 1. számú ajánlás a könyvelőirodák „ragasztó” folyamatainak automatizálása (dokumentumbekérés, NAV–bank–főkönyv eltérések az eÁFA előtt, ügyfélkérdések), ehhez jön itt az AML/KYC (Pmt.) ügyfélátvilágítás. Az ajánlati fókuszt a `accounting_deep_dive.md` mélyfúrás pontosította (lásd lent). A 20 irodát az alábbi szempontok szerint, mérlegelve rangsoroltuk, nem pontszámmal. Ahol a jegyzetek szerint egy adat bizonytalan, a ⚠️ jelölést és a forrás jellegét (snippet, ellenőrizetlen) megtartottuk. Saját következtetést csak „(következtetés)” jelöléssel írtunk.

> ⚠️ **FONTOS: minden adat keresőtalálati kivonatból (snippetből) származik.** A kutatókörnyezet nem tudta megnyitni a forrásoldalakat: a cégek honlapját, a nemzeticegtar.hu, az opten.hu és a profession.hu oldalait sem. A létszámok, árbevételek, címek és álláshirdetések **ellenőrizetlenek**, és névrokon cégekkel is összekeveredhettek. **Kapcsolatfelvétel előtt minden irodát ellenőrizni kell az e-cegjegyzek.hu-n, az opten.hu-n (vagy a nemzeticegtar.hu-n) és az iroda saját honlapján.** Google-értékelést egyik irodáról sem sikerült gyűjteni, és a használt könyvelőprogram sehol nem derült ki.

### Kiválasztási szempontok (röviden)

1. **Tulajdonosi vezetés, kb. 3–25 fő.** Ekkora irodában már elég nagy a fájdalom, és a döntést egyetlen ember hozza meg gyorsan.
2. **Sok kisvállalkozói ügyfél.** Sok ügyfél sok dokumentumbekérést, sok kérdést és sok egyeztetést jelent. Az ügyfélkör egyben csatorna is a Kft. felé.
3. **Kapacitásnyomás.** Ennek jele az álláshirdetés (főleg könyvelőre vagy adatrögzítőre) és a növekedés (árbevétel, új iroda).
4. **Digitális nyitottság:** ügyfélportál, papírmentes működés, távkönyvelés, innovációs szerepvállalás. *Fenntartás:* a nagyon fejlett irodák már építhettek saját eszközt. Ők kiváló interjúalanyok, de nehezebb első vevők.
5. **Elérhetőség.** Szegedi iroda előnyben a vármegyeivel szemben, mert a pilothoz személyes jelenlét kell.
6. **Különleges szempontok:** agrár- és őstermelői ügyfélkör, kínai vagy szerb nyelvű ügyfelek, könyvelő és jogász egy csapatban (AML/KYC).

### Mivel nyissunk? (a mélyfúrás alapján)

- **(b) NAV Online Számla–bank–főkönyv eltérésellenőrzés az eÁFA előtt – fő ajánlat.** Az ÁNYK 2026. dec. 31-én megszűnik. A decemberi havi ÁFA-bevallást már eÁFA-n kell beadni, 2027. jan. 20-ig. 2026 szeptember végén a havi ÁFA-bevallások **98,9%-a még ÁNYK-n** érkezett. Mulasztás esetén akár 1 M Ft bírság is járhat. Ezek snippet-adatok, a halasztásról pedig szakmai körökben beszéltek, de hivatalos döntés nincs, ezért ezt értékesítés előtt ellenőrizni kell.
- **(d) Pmt. (AML) ügyfélakta-rendbetétel és szankciós újraszűrés – fő ajánlat.** A **2026. jan. 9-i Pmt.-módosítás** az EU-, ENSZ- és hazai terrorlistás szűrést, valamint a teljes ügyfélállomány rendszeres újraszűrését írja elő, tágabb tényleges tulajdonos fogalommal. Az iratokat 8 évig kell megőrizni, a bírság akár 400 M Ft. Egyszeri „akta-rendbetétel” projektként és folyamatos szűrésként is eladható. Versenytárs vagy partner: identiGO.
- **(a) Dokumentumbekérés – csak bevezetésként vagy integrációként.** Erre már van olcsó magyar SaaS: ÜgyfélSegéd (kb. 100–200 Ft/ügyfél/hó), Zeuss (35 ezer Ft/hó-tól), Optimato (kulcsrakész szolgáltatás). Ezért nem ezzel nyitunk. A Kft. legfeljebb ezek bevezetőjeként, illetve a Viber-, WhatsApp- és e-mail-csatornák bekötésével adhat hozzá értéket.
- **(c) Ügyfélkérdés- és inbox-triázs – kiegészítő ajánlat**, főleg többnyelvű ügyfélkörnél.

**Időzítés:** a megkeresésnek **2026 október–novemberében** kell megtörténnie. Decemberben és januárban az irodák el vannak árasztva (első eÁFA-bevallás, nyugta-adatszolgáltatási szankciók, KATA-döntések, év végi zárás), ilyenkor semmi újat nem vezetnek be. A következő ablak 2027 február–április, az első fájdalmas ciklusok után.

**Szerepek:** *Interjú* = elsősorban tanulni tőlük. *Pilot* = valószínű első fizető ügyfél. *Mindkettő* = interjúval indítani, és pilotra is esélyes.
**Hullám:** az 1. hullám az első 8 megkeresés, a 2. hullám a következő 12.

## Irodaprofilok (rangsor szerint)

A kínálati oldalt a munkaerőhiány határozza meg. A mérlegképes könyvelő medián bére **bruttó 550 ezer Ft** ([profession.hu](https://www.profession.hu/fizetesek/merlegkepes-konyvelo), snippet). A 13%-os szochóval ez kb. 620 ezer Ft havi teljes költség, ami kb. 140 produktív órával számolva **kb. 4 400 Ft óránként**. Ez saját számítás. A szakma elöregedett: a könyvelők átlagéletkora kb. 51-52 év, a könyvelőképzésre jelentkezők száma öt év alatt 2 654-ről 1 492-re esett, és a könyvelők közel harmada rövid távon kiszállna a szakmából ([haszon.hu](https://haszon.hu/megkeresni/konyveles/konyvelok-munkaerohiany); [trendfm.hu](https://trendfm.hu/cimlap/egyre-tobb-a-munka-de-utanpotlas-nincs-mi-lesz-igy-a-konyvelokkel-15615), snippet, hozzárendelés bizonytalan). Egy MKOE-hez kötött, a KAVOSZ által idézett 2025-ös adat szerint az irodáknak **csak kb. 30%-a digitalizált**, és van, ahol az ügyfél még személyesen hozza a számlát ([kavosz.hu](https://www.kavosz.hu/az-en-vallalkozasom/mi-a-konyvelesben/), snippet). Ez a minta kb. 1 700 vállalkozásra és 7 000 könyvelőre vonatkozik, ami jóval kevesebb, mint a kb. 50 ezer regisztrált könyvelő, ezért **valószínűleg tagsági minta, nem a teljes piac, és ellenőrizni kell**.

**Az eÁFA a legnagyobb és legközelebbi nyomás.** A NAV az Online Számla és más adatok alapján bevallástervezetet készít, amit az adózó vagy a könyvelő ellenőriz, módosít és jóváhagy. A könyvelő szerepe így az adatrögzítésről az **adatellenőrzésre** tolódik ([onadozo.hu](https://www.onadozo.hu/hirek/a-nav-uj-eafa-koncepcioja-bizzuk-a-bevallast-a-gepekre-11753), snippet). Az áfakódok számlatételenként, nem számlánként rendelődnek hozzá. Tipikus eltérés, hogy egy számla hiányzik az áfaanalitikából vagy éppen a NAV Online Számlából, és ezek az eltérések a NAV kockázatelemzésébe kerülnek ([szamlazz.hu blog](https://www.szamlazz.hu/blog/2024/12/eafa-webfeluleti-mukodesenek-tapasztalatai/); [adozona.hu](https://adozona.hu/2027_es_adovaltozasok/2027tol_kotelezo_az_eafa_felkeszult_mar_a_m_A22UE8), snippet). Szeptember végén, három hónappal az ÁNYK megszűnése előtt a havi áfabevallások **98,9%-a még ÁNYK-n érkezett** ([adozona.hu](https://adozona.hu/afa/eAFA_bevallas_ANYK_M2M_riasztas_2EJ749); [penzcentrum.hu](https://www.penzcentrum.hu/vallalkozas/20260927/robban-a-birsagbomba-az-adobevallasoknal-vegleg-kivezetik-a-megszokott-rendszert-egymillios-buntetest-kockaztat-aki-nem-lep-idoben-1206233), snippet). A piac tehát alig kezdett el átállni. Szakmai körökben felmerült az ÁNYK kivezetésének halasztása, de **hivatalos döntés nincs** ([minositettkonyvelok.hu](https://www.minositettkonyvelok.hu/anyk-kivezetese-itt-a-pontos-datum/), snippet, hozzárendelés bizonytalan). Halasztás esetén a sürgősség csökken, de a feladat megmarad, ezért az ajánlatot erre is fel kell készíteni (lásd a kockázatoknál). Helyi jelzés, hogy a Csongrád-Csanád megyei kamara (CSKIK) is közzétett tájékoztatót az eÁFA változásáról ([cskik.hu](https://cskik.hu/fontos-valtozas-az-eafa-val-kapcsolatban/)). Ez a közös rendezvény természetes kapuja lehet.

**A Pmt. a legerősebb félelemalapú érv, és nincs naptári határideje.** Minden Magyarországon működő könyvelési szolgáltatónak belső pénzmosás elleni szabályzatot kell vezetnie, és **minden ügyfelet** át kell világítania, a tényleges tulajdonos dokumentált azonosításával együtt ([net.jogtar.hu](https://net.jogtar.hu/jogszabaly?docid=a1700053.tv); [minositettkonyvelok.hu](https://www.minositettkonyvelok.hu/pmt_2026_01_uj/)). A 2026. január 9-i módosítás a 2028-ig tartó változássorozat első érezhető lépése. Kiterjesztette a szankciós szűrést a hazai terrorellenes listára, előírta a teljes ügyfélkör rendszeres újraszűrését, és a tényleges irányítást gyakorló személyt is tényleges tulajdonosnak tekinti. A Minősített Könyvelők Egyesülete szerint a módosítás inkább pontosít, mint új kötelezettséget teremt. A bírságkeret könyvelőknél **100 ezer és 400 millió Ft** között van. Jelentések szerint akár egyetlen hiányzó dokumentumért is bírságoltak, és a tipikus hiba az alapvető azonosításban és a jogi személyek dokumentációjában volt, nem a kockázati logikában ([identigo.hu](https://identigo.hu/blog/penzmosas-elleni-birsag-7-anonim-esetpelda-konkretumokkal/); [forum.identigo.hu](https://forum.identigo.hu/t/ugyfelatvilagitas-jogi-szemelyek-ellenorzesi-tapasztalatok-2026/461), szolgáltatói forrás, snippet). A NAV pénzmosás elleni egysége 2024 végéig közel 4 000 szankciót alkalmazott, de az adatból nem derül ki, hogy ez csak a könyvelőkre vonatkozik-e. Az sincs ellenőrizve, hogy a Pmt. 5. §-a szerint pontosan ki a könyvelők felügyelője; a források a NAV-ra utalnak.

A **KATA** visszaállítása 300-350 ezer vállalkozást érinthet ([adozona.hu GKI](https://adozona.hu/kata_kiva/kata_visszater_2027_vallalkozas_adozas_8W800T), snippet). Ez sok kis díjú új ügyfelet hozhat az irodákba, akiknek egyenként kell átvilágítást és bekérési rutint kiépíteni. A KATA tehát közvetve a Pmt-ügyfélfelvételi szolgáltatás keresletét növeli. A **bérszámfejtésben** a 2026-os mentességekhez adóelőleg-nyilatkozatot kell begyűjteni, amely munkáltatóváltáskor nem öröklődik ([money.hu](https://tudastar.money.hu/hir/20260108/szja-kedvezmeny-adoeloleg-nyilatkozat/), snippet). A 2027-es minimálbér és garantált bérminimum 2026 októberében **még nincs eldöntve** ([tudasfaja.com](https://www.tudasfaja.com/minimalber-2027-elmaradhat-a-14-szazalekos-emeles-uj-rendszeren-dolgoznak/), snippet). A bérszámfejtési adatbekérés valós, de érzékeny adatokkal (gyerekek, betegszabadság) jár, és a hiba közvetlenül a nettó bért érinti. Ezért induló ajánlatnak nem javasoljuk.

Két terület viszont nincs telítve. Az egyik az **eÁFA-előtti háromoldalú egyeztetés**: a NAV Online Számla, a bankkivonat és a főkönyv vagy áfaanalitika összevetése. Ezt részben lefedi a könyvelőprogram (ő készíti és tölti fel az analitikát), az eÁFA saját figyelmeztetései és a Kulcs Connect vagy Zeuss bankpárosítása, de egyetlen azonosított szereplő sem árulja **programfüggetlen, iroda szintű kivétellistaként**, amely minden ügyfelet egy nézetben mutat, és kifejezetten az átállási hónapokra készül. A másik a **Pmt-akták rendbetétele és a folyamatos újraszűrés**, ahol az identiGO-n kívül nem találtunk termékszereplőt. A Kft valódi különbsége négy dolog lehet. Az első a **személyes bevezetés és változáskezelés** azoknál az irodáknál, amelyek maguktól nem vezetnek be szoftvert (a kb. 30%-os digitalizáltság, ha igaz, ezt a réteget nagynak mutatja). A második a SaaS-ok által nem kezelt csatornák (Viber, WhatsApp, a bejövő postafiók szétválogatása). A harmadik az iroda saját, régi programjához igazított integráció. A negyedik a határidőhöz kötött megfelelési munka.

Az ellenérvet is érdemes komolyan venni: lehet-e egyszerűen az ÜgyfélSegéd vagy a Zeuss **dél-alföldi bevezetési partnere** lenni saját fejlesztés nélkül? Ez a legalacsonyabb kockázatú út, és a harmadik ajánlat ezt építi be. Önmagában azonban vékony a jutaléka és a díja, és nem épít saját szellemi tulajdont. Ezért kiegészítő lábnak jó, vezető ajánlatnak nem.

## Két megfelelési ajánlattal érdemes nyitni, a bekérés csak a harmadik láb

A javasolt sorrend: **(1) eÁFA Átállás-kontroll** mint vezető ajánlat októbertől januárig, **(2) Pmt-rendrakás és újraszűrés** mint párhuzamos, határidő nélküli, félelemalapú ajánlat, amelynek szállítása februártól áprilisig tart, **(3) Irodai bekérés-bevezetés** partner-SaaS-szal és saját csatornákkal mint kiegészítés és hosszú távú havidíj-alap. A sorrend lényege, hogy az első kettőhöz bírság és dátum tartozik, ezért fizetési hajlandóságot teremt, a harmadikat pedig az olcsó SaaS-ok miatt csak szolgáltatásként lehet eladni.

Az eÁFA-ajánlatnak két feltétele van. Először: **nem ad adótanácsot és nem nyújt be semmit**. Kivétellistát ad, a döntést a könyvelő hozza meg. Ezzel a felelősségi kockázat kezelhető, és a könyvelőprogram-gyártóval sem versenyez közvetlenül, hiszen az analitikát továbbra is a program készíti. Másodszor: az értéket az **első három ciklusban** kell bizonyítani (a 2026. novemberi próbafuttatás, a decemberi és a januári kötelező beadás), mert ha az eÁFA stabilizálódik és a programok javítanak, a kivételek száma és ezzel az ajánlat értéke csökken. Ezért már az elején egy állandó „havi zárási kivétellistává” kell bővíteni: hiányzó számlaképek, párosítatlan banktételek, NAV-ban szereplő, de le nem könyvelt számlák. Ez a forma túléli az átállást.

A Pmt-ajánlat erőssége, hogy a kötelezettség **ügyfelenként jelentkezik, 8 éves megőrzést kíván, és 2026 óta a teljes ügyfélkör ismételt szűrését** is előírja. Egy 200 ügyfeles irodánál ez egyszeri, ügyfelenként árazható projekt, utána pedig ismétlődő havidíj. A KATA-hullám miatt új ügyfelek tömegesen érkezhetnek, így az átvilágítás folyamatos igény lesz. Szállítása munkaigényes, de kevés fejlesztést kíván, ezért jól illik az értékesítő tulajdonoshoz és egy diák vagy junior segítőhöz. Az identiGO-val érdemes tisztázni, hogy partner vagy versenytárs: ha az ő nyilvántartójukba töltjük fel az aktákat, az csökkenti a fejlesztést és a szabályozási kockázatot.

A becsült érték a vevőnek (saját becslés, interjún validálandó): ha a Karbon heti 3,2 órája csak harmadrészt érvényes, egy 5 fős iroda havonta kb. 20-25 órát nyer, ami kb. 90-110 ezer Ft kapacitás. Ennél fontosabb, hogy **2-3 plusz ügyfelet, azaz havi kb. 60-135 ezer Ft többletbevételt** vállalhat felvétel nélkül. Az eÁFA-nál a megelőzött bírság (akár 1 millió Ft) és a NAV-kockázatelemzés elkerülése az érv, a Pmt-nél a 100 ezer Ft-os minimumbírság már egyetlen hiányzó dokumentumért.

## Ajánlat-vázlat: három csomag, becsült árakkal

*Minden ár és ráfordítás **saját becslés**. Magyar fizetési hajlandósági adat nincs, az árakat az első 5-10 interjú után újra kell kalibrálni. Az árak nettók (+27% áfa). Referenciairoda: 5 fő, kb. 200 ügyfél, ebből kb. 100-130 áfaalany.*

### 1. csomag: „eÁFA Átállás-kontroll” (vezető ajánlat)

**Hatókör.** Az iroda áfaalany ügyfeleinél minden hónapban, a beadás előtt összeveti a NAV Online Számlából lekérdezett kimenő és bejövő számlákat, a bankkivonat tételeit és a könyvelőprogramból exportált főkönyvi és áfaanalitikai adatokat. Ügyfelenként és tételenként kivétellistát ad, prioritással: NAV-ban van, de nincs lekönyvelve; le van könyvelve, de nincs a NAV-ban; eltérő áfaösszeg vagy -kulcs; párosítatlan banktétel; gyanús áfakód. Az eredmény Excel/PDF riport és egy egyszerű webes áttekintő, az iroda munkatársai szerint szétosztva. Csak olvas, semmit nem ír vissza a könyvelőprogramba és nem nyújt be a NAV-hoz. Része a beállítás (NAV technikai felhasználók ügyfelenkénti rögzítése, az iroda programjának exportfolyamata), egy kétórás betanítás és a 2027. januári első kötelező ciklus alatti fokozott támogatás.

**Ár (becslés).** Egyszeri beállítás **300-600 ezer Ft** irodánként. Havidíj **áfaalany ügyfelenként 300-800 Ft**, a referenciairodánál kb. 40-100 ezer Ft/hó, minimum havi 35 ezer Ft (a Zeuss belépő árszintje). Bevezető ajánlat: aki novemberig aláír, a decemberi és januári ciklust a beállítási díj részeként kapja. Teljesítési vállalás: ha az első három ciklusban egyetlen érdemi eltérést sem talál, az első havidíjat visszatérítjük. Ez a láthatatlan automatizálásból adódó lemorzsolódás ellen is véd.

**Ráfordítás.** A közös mag (NAV Online Számla lekérdező, bankkivonat-feldolgozó PDF/CSV/MT940 formátumra, egy könyvelőprogram exportjának beolvasója, szabálymotor, riport) **kb. 4-6 hét fejlesztői munka** egy fejlesztőtől, ha részmunkaidőben dolgozik, inkább 6-8 hét. Minden további könyvelőprogram-export 1-2 hét. Irodánként a bevezetés 2-4 fejlesztői nap és 1-2 értékesítői nap, a havi üzem irodánként 2-4 óra. Egy fejlesztő a bevezetési hullámban kb. 6-8 irodát tud vállalni.

### 2. csomag: „Pmt-rendrakás + folyamatos szűrés”

**Hatókör.** Egyszeri hátralék-feldolgozás: az iroda összes ügyfelére kitöltött vagy frissített átvilágítási adatlap, tényleges tulajdonos (a 2026-os bővebb fogalom szerint), a cégadatok összevetése a cégjegyzékkel, kockázati besorolás (alacsony, közepes, magas), hiánylista és ügyfélnek szóló bekérő levelek, rendezett 8 éves archívum. Ezt követi a havi vagy negyedéves újraszűrés az EU-s, ENSZ-es és magyar nemzeti listákon, naplózva, valamint új ügyfél felvételekor egy átvilágítási folyamat. A belső szabályzatot az iroda saját sablonjával (MKK, MKVK) frissíti. Jogi tanácsot nem ad.

**Ár (becslés).** Hátralék-feldolgozás **ügyfelenként 2-5 ezer Ft**, a referenciairodánál 400 ezer-1 millió Ft. Folyamatos szűrés **havi 15-40 ezer Ft** irodánként, új ügyfél felvétele **ügyfelenként 3-6 ezer Ft**.

**Ráfordítás.** Eszközoldalon kb. 2-3 hét (űrlapok, listaletöltés és -egyeztetés, archívum), vagy kevesebb, ha az identiGO-ra építünk. Irodánként a hátralék kb. 5-10 munkanap, főleg adminisztráció és ügyfélkommunikáció, amit az értékesítő koordinál és egy betanított diák vagy junior végez. Ehhez még tisztázni kell, mennyi idő jut egy ügyfélre; ez az egyik interjúkérdés.

### 3. csomag: „Irodai bekérés-bevezetés” (partnercsomag)

**Hatókör.** Az iroda kiválasztja az ÜgyfélSegédet vagy a Zeusst (vagy ha ragaszkodik a meglévő Google/M365 környezetéhez, egy könnyű saját megoldást kap). A Kft betölti az ügyféllistát, beköti a NAV technikai felhasználókat, beállítja a havi bekérő ütemezést, és betanítja a munkatársakat. Erre épít rá a SaaS-ok által nem kezelt csatornákon: a bejövő e-mailek és mellékletek automatikus szétválogatása ügyfelenként, Viber- vagy WhatsApp-os bizonylatfogadás, és havi „ki mit nem küldött” riport a tulajdonosnak.

**Ár (becslés).** Beállítás **150-400 ezer Ft**, havi üzemeltetés és hangolás **20-60 ezer Ft** a SaaS díján felül (azt az iroda közvetlenül fizeti). Ha a SaaS-szállító partnerprogramot kínál, a jutalék kiegészítő bevétel. Ennek meglétét és mértékét nem ellenőriztük.

**Ráfordítás.** Irodánként 3-6 nap; a csatornabővítés közös magja kb. 2-3 hét.

### Csomagolás és bevételi modell

A belépő termék egy **„Átállási csomag”**: az 1. csomag beállítása és a 2. csomag hátralék-feldolgozása 10-15%-os kedvezménnyel, majd mindkettő havidíja. A 3. csomag a második évben jön, amikor már bizalom van. Tíz referenciairodával számolva (saját becslés): egyszeri bevétel irodánként kb. 0,7-1,6 millió Ft, havidíj kb. 55-140 ezer Ft. Ez 10 irodánál **7-16 millió Ft egyszeri** és **havi 0,55-1,4 millió Ft ismétlődő** bevétel. Nagyságrendileg összhangban van a korábbi jelentés első évre becsült 15-30 millió Ft-os keretével, de csak egy vertikumból. A szűk keresztmetszet a fejlesztő: egyszerre kb. 6-10 ügyfél, ezért a második fejlesztő felvételét havi kb. 1,5-2 millió Ft ismétlődő bevételnél érdemes megfontolni.

## A legnagyobb kockázat a gyorsan bezáruló ablak és az inkumbens programok

**Az időzítés kétirányú kockázat.** Ha az ÁNYK kivezetését elhalasztják, a januári sürgősség eltűnik, és az 1. csomagot a „havi zárási kivétellista” értékére kell átpozícionálni. Ha viszont az átállás simán megy, mert a programgyártók (Kulcs, Novitax, RLB) jól megoldják, az eÁFA figyelmeztetései pedig elég jók, akkor a kivételek száma gyorsan csökken. Mindkét esetre az a válasz, hogy az ajánlatot már az elején tartós havi kontrollként kell építeni, és a Pmt-csomagot párhuzamosan kell eladni, mert annak nincs határideje.

**A SaaS-árhorgony nyomja az árat.** Az ügyfelenkénti havi 100-200 Ft-os ÜgyfélSegéd és a havi 35 ezer Ft-os Zeuss mellett minden 50 ezer Ft feletti havidíjat szolgáltatással kell indokolni (beállítás, betanítás, egyedi integráció, havi riport), nem funkciókkal. Az iBookr/Zeuss és az Acounto gyorsan fejleszt, és az utóbbi saját szoftverét partnerkönyvelőknek is licencelné. Ha ezek az eÁFA-kontrollt is beépítik, a Kft programfüggetlen előnye szűkül.

**Szakmai felelősség.** Egy áfakód-logikai tévedés, ami miatt a könyvelő nem vesz észre egy hibát, a Kft-re is visszaüthet. Ellenszer: csak jelzés, emberi felülvizsgálat, a 12 havi díjban maximált felelősség, és szakmai felelősségbiztosítás. Az áfaszabályokat egy mérlegképes vagy adótanácsadó partnerrel érdemes validáltatni. A Pmt-nél ugyanez a helyzet a szabályozás 2028-ig tartó változásai miatt, ráadásul az sem biztos, hogy a felügyelet elfogadja az automatizált nyilvántartást.

**Bevezetési és adatkockázat.** Ha az irodák többsége valóban nem digitalizált, a technikai felhasználók beszerzése ügyfelenként lassú lehet, és az irodák az ügyfeleiket sem tudják portálra terelni. A technikai felhasználói kulcsok és az okmánymásolatok kezelése egyetlen incidensnél a bizalmat, vagyis a Kft fő előnyét tenné tönkre.

**Kapacitás és szervezet.** A fejlesztő jelenleg főállásban dolgozik, és a novemberi árnyékfuttatás és a januári hiperszupport egybeeshet a munkahelyi év végével. Amíg a munkaszerződés jogi átvizsgálása nincs kész, nem lehet szállítani. Végül a bizonyítékok gyengesége is kockázat: a magyar számok többsége snippet, a megtakarítási becslések nemzetközi szállítói adatokból (Karbon, Zeuss) vannak extrapolálva, és magyar időfelhasználási vagy fizetési hajlandósági mérés nincs. Az árakat és a megtérülési érvet ezért az első interjúk adataival kell felülírni, mielőtt értékesítési anyagba kerülnek.

## Konklúzió

A mélyfúrás legfontosabb tanulsága, hogy a magyar könyvelőiroda-piacon **a „munkacsökkentés” már árucikk, a „kockázatcsökkentés” még nem**. A korábbi jelentés a ragasztót azért látta szabadnak, mert a nagy könyvelőprogramokat vizsgálta. Közben egy réteg olcsó, irodákra szabott magyar SaaS épült ki, amely a bekérést és a hiánylistát havi néhány tízezer forintért megoldja. Ami ezekből hiányzik, az a határidőhöz és bírsághoz kötött ellenőrző munka, amit a könyvelő nem szívesen bíz egy önkiszolgáló szoftverre, de egy helyi, személyesen ismert partnerre igen. A Kft-nek tehát nem kell jobb terméket építenie a Zeussnál; elég a felelősség súlyát megosztania az irodával a legkényesebb hónapokban.

A második következmény stratégiai. Ha az átállási ablakban tíz iroda NAV-, bank- és programexport-adatain fut a kivételmotor, akkor 2027 közepére a Kft-nél lesz a legjobb helyi tudás arról, mely eltérések valósak, és melyik program exportja hogyan viselkedik. Ez a tudás és a Pmt-akták rendezettsége két további lehetőséget is nyit. Az egyik egy programfüggetlen „havi zárási kontroll” termék, amelyből 10-20 iroda után vertikális SaaS lehet. A másik, hosszabb távon, az elöregedő irodák adásvételénél a „digitálisan átadható iroda” szerep, amit Amerikában a Current-típusú felvásárlók már bevételre váltanak. Egyik sem indulópont, de mindkettőhöz az vezet, ha a Kft most, október–novemberben, a határidő előtt az irodák mellé áll.

## 2. Mintavétel

### 2.1 Létszám

- **Cél: 18 interjú** könyvelőirodákkal (minimum 15, maximum 20). Ennél több interjú ritkán ad új mintázatot; ha 12–15 után már nem hallunk újat, megállhatunk.
- **Plusz 2–3 szakértői vagy multiplikátor-beszélgetés**, ezeket külön értékeljük, nem számítanak a kvótába:
  - a RÓ Könyvelőiroda tulajdonosa (MinKE digitalizációs munkacsoport, `prospects_county.md`);
  - egy könyvelőprogram helyi viszonteladója vagy oktatója (integráció, export);
  - CSMKIK vagy MKOE-kapcsolat (rendezvény, csatorna).

> Köszönjük a mai beszélgetést, nagyon sokat tanultunk belőle, különösen [egy konkrét dolog, amit mondott]. Mellékelten küldöm az ígért eÁFA-felkészültségi ellenőrzőlistát. A kutatás anonim összefoglalóját december elején küldjük.

> [Név]

### 3.4 Adatvédelmi óvatosság a toborzásnál

- **A könyvviteli szolgáltatók nyilvántartásából (PM-névjegyzék, XLS) ne küldjünk tömeges e-mailt, és ne telefonáljunk végig a listán.** A névjegyzék természetes személyek adatait tartalmazza (cím, telefon). A NAIH állást foglalt a nyilvánosság korlátairól, és a közvetlen megkeresés jogalapja (jogos érdek) kétséges. A névjegyzék legfeljebb arra használható, hogy megbecsüljük a vármegyei könyvelők számát, vagy ellenőrizzük, regisztrált-e valaki.
- **Csak üzleti elérhetőséget használjunk:** az iroda honlapján, cégjegyzékben vagy kamarai adatbázisban közzétett általános e-mail-címet, kapcsolati űrlapot, irodai telefonszámot, LinkedIn-profilt.
- **Gazdasági reklám:** természetes személynek küldött közvetlen üzleti ajánlathoz előzetes hozzájárulás kellhet (Grt.). A kutatási felkérés nem reklám, de **ne csempésszünk bele ajánlatot**, és minden hideg üzenetben legyen leiratkozási lehetőség.
- A meleg bemutatásnál az ismerős adja meg a kapcsolatot, vagy kérdezi meg előbb az érintettet. Adatot ne kérjünk ki a háta mögött.
- A toborzási táblát (név, iroda, elérhetőség, státusz) korlátozott hozzáférésű helyen tároljuk, és a kutatás végén töröljük azok adatait, akik nem kértek további kapcsolatot.

**Toborzási tábla (oszlopok):** iroda · top 20 #/hullám · szegmens(ek) · kapcsolattartó (szerep) · meleg út (ki ismeri) · csatorna · 1. megkeresés dátuma · 1. utánkövetés · 2. utánkövetés · státusz (nincs válasz / elutasította / időpont / kész) · interjú dátuma · interjúkód (I-01…).

## 4. Az interjú lebonyolítása

### 4.1 Előkészítés (alanyonként kb. 20 perc)

- Az iroda ellenőrzött adatai: létszám, árbevétel, ügyfélkör, honlap, álláshirdetés, fizetett-e már valamilyen eszközért, ha ez látszik.
- Két előzetes kérdés az alanynak (opcionális, e-mailben): kb. hány ügyfél, és milyen könyvelőprogram. Ez spórol 5 percet.
- Kinyomtatott kérdéssor (5. fejezet), jegyzetsablon (7. fejezet), a (b) és (d) egyoldalas makettje egy mappában (6. fejezet). **A makettet csak a végén vesszük elő.**
- Adatkezelési tájékoztató egy rövid bekezdésben (lásd 10.3), és a hozzájárulás a hangfelvételhez.

### 4.2 Szerepek

| Szerep | Ki | Feladat |
|---|---|---|
| **Kérdező (moderátor)** | Az **értékesítő** az első 5 interjúban (ő hozza a kapcsolatot és a bizalmat) | Vezeti a beszélgetést, tartja az időt, mélyít („mesélje el a legutóbbit”), és nem árul. |
| **Jegyzetelő + technikai mélyítő** | A **fejlesztő** | Szó szerinti idézeteket ír, számokat rögzít (óra, darab, Ft). A **szoftver- és integrációs blokkot ő kérdezi** (export, formátum, NAV technikai felhasználó). A végén összefoglalja, mit hallott. |
| Szerepcsere | A 6. interjútól | A szerepek felváltva mennek, hogy mindketten megtanulják a másik részét. Az értékesítő akkor se kezdjen bele ajánlatba, ha ő jegyzetel. |

Szabály: **egyszerre egy ember kérdez.** A jegyzetelő csak a blokkok végén szól közbe, egy-egy pontosító kérdéssel.

### 4.3 Hozzájárulás a felvételhez

A beszélgetés elején, a felvétel elindítása előtt:

> „Ha nem bánja, felvennénk a beszélgetést, hogy ne kelljen mindent jegyzetelnünk. A felvételt csak mi ketten hallgatjuk meg, legfeljebb 30 napig tároljuk, utána töröljük, és amit idézünk, név nélkül idézzük. Ügyféladatot, nevet, adószámot kérem, ne mondjon. Ha bármikor kikapcsolnánk, csak szóljon. Rendben van így?”

- A hozzájárulás tényét a felvétel elején még egyszer mondjuk ki („Ön hozzájárult a felvételhez, ugye?”), és írjuk be a jegyzetbe is.
- Ha nemet mond, csak jegyzetelünk. Ez is teljesen rendben van.
- Ha AI-alapú leiratkészítőt használunk, ezt mondjuk meg, és olyan szolgáltatást válasszunk, amely nem tanít a felvételen, és EU-ban tárol (lásd 10.3).

### 4.4 Mom Test-alapelvek a gyakorlatban

1. **Az ő életükről beszélünk, nem az ötletünkről.** Az első 35 percben nem mondjuk ki, hogy mit szeretnénk építeni.
2. **Múlt, nem jövő:** konkrét eseteket kérdezünk („a legutóbbi alkalommal…”), nem véleményt vagy feltételezést („használná-e…?”).
3. **Számokat kérünk:** óra, ügyfélszám, alkalom, forint. Ha nem tudja, rekonstruáljuk vele együtt („az októberi ÁFA-zárásnál ki mit csinált, hány órát?”).
4. **Bókot nem gyűjtünk.** Ha azt mondja, „ez nagyon jó ötlet lenne”, visszakérdezünk: „Mit próbált eddig ennek a megoldására?”
5. **Keressük a pénzt és az időt, amit már elköltött a problémára.** Ha semmit nem költött rá és nem keresett megoldást, valószínűleg nem fáj eléggé.
6. **Csendet hagyunk.** A legjobb válaszok a második szünet után jönnek.
7. **Nem adunk tanácsot és nem vitatkozunk.** Különösen adókérdésben nem (lásd 10. fejezet).

**Rossz kérdés helyett jó kérdés:**

| Kerülendő | Helyette |
|---|---|
| „Használna egy eszközt, ami eÁFA előtt kilistázza az eltéréseket?” | „Az utolsó ÁFA-bevallás előtt hogyan derült ki, hogy valami nem stimmel a NAV-adatokkal? Mesélje el lépésről lépésre!” |
| „Fontos Önnek az ügyfélátvilágítás?” | „Mikor nézték át utoljára az összes ügyfél Pmt.-aktáját? Ki csinálta, mennyi ideig tartott?” |
| „Mennyit fizetne érte?” | „Mire költött az elmúlt egy évben szoftverre, képzésre, külső segítségre? Kb. mennyit?” |
| „Problémát jelent a dokumentumbekérés?” | „Az elmúlt hónapban hány ügyfélnél kellett háromszor vagy többször szólni a hiányzó számlákért?” |
| „Gondolja, hogy az AI segíthetne?” | „Ha holnaptól lenne egy plusz embere heti 10 órára, mit adna neki először?” |

### 4.5 45 perces menetrend

| Idő | Blokk | Ki kérdez | Cél |

| 0:00–0:03 | Bemutatkozás, cél („tanulni jöttünk, nem árulni”), felvétel engedélyezése | Moderátor | Bizalom, keretek |
| 0:03–0:07 | **A** Iroda profilja | Moderátor | Szegmentálás: létszám, ügyfélszám, ügyfélkör |

**Gyakorlati tippek:**
- Ha az alany 30 percet ad, a G és az I blokk kimarad, a megoldás-próba pedig egy külön, második találkozóra kerül.

- **Közvetlenül az interjú után** a két alapító 15 percben átbeszéli és kitölti a jegyzetsablont és a pontozást (7. fejezet). A memória 24 óra alatt sokat veszít.

## 5. Kérdéssor

Jelölések: **Fő kérdés** (mindig feltesszük), *mélyítő kérdés* (ha van idő vagy érdekes a válasz), **Piros zászló** (a hipotézis ellen szóló vagy figyelmeztető válasz). A számokat mindig kérjük.

### A) Az iroda profilja (3–4 perc)

1. **Hány fővel dolgoznak, és ki mit csinál?** (tulajdonos, könyvelők, bérszámfejtő, adminisztrátor)
2. **Kb. hány ügyfelük van? Ebből hány Kft./Bt., egyéni vállalkozó, KATA-s, őstermelő, egyéb?**
3. **Hány ügyfél ÁFA-alany, és ebből hány havi bevalló?**
   - *Mélyítés:* „Van-e sok külföldi vagy idegen nyelvű ügyfél? Agrárügyfelek?”
   - *Mélyítés:* „Hogyan változott az ügyfélszám az elmúlt 2 évben? Vállalnának több ügyfelet, ha bírnák?”
4. *Mélyítés:* „Keresnek most munkatársat? Mióta? Mennyire nehéz könyvelőt találni Szegeden?”

**Piros zászló:** kevesebb mint 20 ÁFA-s ügyfél, szinte csak alanyi mentes vagy KATA-s ügyfélkör. Ekkor (b) gyenge, (d) is kicsi.

### B) A havi ciklus és az időráfordítás (4 perc)

5. **Vegyük végig a múlt hónapot! Mi történt az 1-jétől a hónap végéig? Mikor van a legnagyobb nyomás?**
   - *Mélyítés:* „Mi történik a 12-éig (bérek, járulékok) és a 20-áig (ÁFA)? Hol szokott csúszni?”
6. **Ha a havi munkaidőt 100%-nak vesszük, nagyjából mennyi megy el a dokumentumok begyűjtésére, a rögzítésre és kontírozásra, az egyeztetésre (bank, NAV), a bevallásokra, a bérszámfejtésre és az ügyfélkérdésekre?**
   - *Mélyítés:* „Melyik az, amit a legszívesebben kiadna a kezéből? Miért?”
   - *Mélyítés:* „Ha holnaptól lenne egy plusz embere heti 10 órára, mit adna neki először?”
7. *Mélyítés:* „Mennyi túlórával jár egy átlagos hónap? És a január?”

**Piros zászló:** „nálunk minden rendben van, nincs csúszás”, és nem tud konkrét szűk keresztmetszetet mondani. Ilyenkor vagy tényleg rendben van, vagy nem a döntéshozóval beszélünk.

### C) Dokumentumbekérés (a kontroll) (3–4 perc)

8. **Hogyan kapják meg a számlákat és a bankkivonatokat az ügyfelektől? Milyen csatornán?** (e-mail, portál, Viber/WhatsApp, személyesen, papíron)
9. **Az elmúlt hónapban az ügyfelek kb. hány százaléka küldött hiánytalanul a határidőig? Hányszor kellett szólni a többieknek?**
   - *Mélyítés:* „Ki szól nekik, és hogyan? Mennyi idő ez havonta?”
   - *Mélyítés:* „Honnan tudják, hogy valami hiányzik? Megnézik a NAV Online Számlát?”
10. *Mélyítés:* „Próbáltak már portált vagy automatikus emlékeztetőt? (ÜgyfélSegéd, Zeuss, saját űrlap) Mi lett vele?”

**Piros zászló (a)-ra nézve:** „már ÜgyfélSegédet vagy Zeusst használunk, és működik”. Ez nem rossz hír: a (a) helyett (b)-t vagy (d)-t érdemes vizsgálni náluk, illetve azt, hogy partnerként együttműködhetünk-e az eszközzel.

### D) NAV–bank–főkönyv egyeztetés (4 perc) – a (b) hipotézis magja

11. **Mesélje el, hogyan zajlott az utolsó ÁFA-bevallás előtti ellenőrzés egy tipikus ügyfélnél! Milyen listákat néz meg, és milyen sorrendben?**
    - *Mélyítés:* „Honnan tölti le a NAV Online Számla adatokat? A könyvelőprogramba közvetlenül, vagy kézzel?”
    - *Mélyítés:* „Hogyan veti össze a bankkivonattal? Excelben? Szemmel?”
12. **Milyen eltérések szoktak előjönni?** (NAV-ban van, de nincs a főkönyvben; kifizették, de nincs számla; eltérő ÁFA-kulcs vagy összeg; duplikáció; sztornó; devizás)
    - *Mélyítés:* „Az elmúlt 3 hónapban volt-e olyan, hogy egy eltérés csak a bevallás után derült ki? Mi lett a vége? (önellenőrzés, NAV-levél, bírság)”
13. **Ügyfelenként kb. mennyi időt visz el ez az ellenőrzés egy átlagos hónapban? És a legrosszabb ügyfélnél?**
    - *Mélyítés:* „Ki csinálja? A tapasztalt könyvelő vagy az asszisztens? Le van-e írva valahol, hogyan kell?”
14. *Mélyítés:* „Kaptak-e az elmúlt egy évben NAV-tól eltérésre vagy adatminőségre vonatkozó megkeresést vagy levelet?”

**Piros zászló (b)-re nézve:**
- „A program automatikusan párosít, csak a kivételeket nézem, az pár perc.”
- „Évente egyszer nézzük meg rendesen.”
- Nem tud konkrét eltérést vagy esetet mondani az elmúlt 3 hónapból.

**Zöld jel:** saját Excel-sablon vagy makró, külön ember erre a feladatra, önellenőrzések miatti bosszúság, „mindig a 18–19-én derül ki”.

### E) eÁFA-felkészülés (4 perc)

15. **Hol tartanak az eÁFA-val? Adtak már be eÁFA-n keresztül bevallást, vagy próbálták az eÁFA tervezetet?**
    - *Mélyítés:* „Mit látott, amikor összevetette a NAV-tervezetet a saját analitikájával? Milyen eltérések jöttek ki?”
16. **Mit csinál a könyvelőprogramjuk az eÁFA-hoz?** (ÁFA-analitika előállítása, M2M-feltöltés, frissítés)
    - *Mélyítés:* „Mit mondott a szoftverszállító, mikor lesz kész? Bízik benne?”
17. **Mi a terv a decemberi bevallásra (2027. január 20.)? Mi aggasztja a legjobban?**
    - *Mélyítés:* „Mennyi plusz időre számít a januári első ciklusban? Hogyan fogják megoldani?”
    - *Mélyítés:* „Hogyan készülnek a nyugtaadat-szolgáltatás miatt a kiskereskedő ügyfeleknél?”
18. *Mélyítés:* „Ha az ÁNYK kivezetését elhalasztanák, mit változtatna ez Önöknél?”

**Piros zászló:**
- „A szoftver mindent megold, nem foglalkozunk vele.”
- „Már két hónapja eÁFA-n adunk be, semmi gond.”
- Teljes nyugalom, határidő-érzet nélkül.

Ezek a válaszok (b) sürgősségét gyengítik. Jegyezzük fel azt is, ha az alany a halasztásra vár, mert ez az időzítést befolyásolja.

### F) Pmt./AML ügyfélátvilágítás (5–6 perc) – a (d) hipotézis magja

19. **Hogyan zajlik egy új ügyfél felvételekor az átvilágítás? Mit kérnek be, hol tárolják?** (személyazonosító okmány, tényleges tulajdonosi nyilatkozat, cégkivonat, kockázati besorolás)
20. **Mikor nézték át utoljára a meglévő ügyfelek aktáit? Mi derült ki?**
    - *Mélyítés:* „Az ügyfelek kb. hány százalékánál hiányos valami? (lejárt okmány, hiányzó nyilatkozat, változott tulajdonos)”
    - *Mélyítés:* „Az idei módosítás után (2026. január) végeztek-e szankciólistás újraszűrést a teljes ügyfélkörön? Hogyan?”
21. **Volt-e Pmt.-ellenőrzésük, vagy hallottak kollégától ellenőrzésről, bírságról? Mi volt a tapasztalat?**
22. **Ki felel az irodában a Pmt.-ért? Mennyi idő megy el erre havonta, illetve egy alkalommal?**
    - *Mélyítés:* „Használnak sablont vagy eszközt? (MinKE-segédlet, identiGO, saját Excel, ügyvéd)”
    - *Mélyítés:* „Mennyit költöttek rá az elmúlt egy évben? (szabályzat, képzés, szoftver)”
23. *Mélyítés:* „Ha holnap jönne egy ellenőrzés, mennyire nyugodtan nyitná ki az aktákat?” (1–5)

**Piros zászló (d)-re nézve:**
- „identiGO-t használunk, minden rendben”.
- Kevés jogi személy ügyfél.
- „Ez csak papírmunka, senki nem ellenőrzi.” Közöny: nem tart a bírságtól, és nem költött rá semmit.

**Zöld jel:** ellenőrzési tapasztalat vagy kolléga bírsága, hiányzó újraszűrés, „ezt tavasszal rendbe akartuk tenni, de nem jutott rá idő”.

### G) Ügyfélkommunikáció (2 perc)

24. **Milyen csatornákon keresik Önöket az ügyfelek? (telefon, e-mail, Viber, WhatsApp, Messenger) Hány megkeresés jön egy átlagos héten?**
    - *Mélyítés:* „Milyen kérdések ismétlődnek? (KATA 2027, bérkedvezmények, eÁFA, nyugta)”
    - *Mélyítés:* „Ki válaszol? Mennyi idő ez hetente?”

**Piros zászló:** „ritkán keresnek, és a telefon a megszokott”. Ez a (c) ügyfélkérdés-bot ötletet gyengíti (a fő ajánlatot nem).

### H) Használt szoftverek és integrációk (3 perc, a fejlesztő kérdez)

25. **Milyen könyvelőprogramot használnak, melyik verziót, helyben vagy felhőben?** (RLB-60, Novitax NTAX/TAXA, Kulcs-Könyvelés, Infotéka, Forint-Soft, Tensoft, SMARTBooks, egyéb)
26. **Hogyan jön be a NAV Online Számla adat és a bankkivonat a programba?** (közvetlen NAV-letöltés technikai felhasználóval, fájlimport, PDF-konverter, kézi rögzítés)
    - *Mélyítés:* „Az ügyfelek NAV technikai felhasználóját kezelik-e Önök? Hány ügyfélnél?”
27. **Ki tudják-e exportálni a főkönyvet vagy az ÁFA-analitikát fájlba? Milyen formátumban? Meg tudná mutatni, hol van a menüben?** (ha lehet, képernyőn, ügyféladat nélkül)
28. *Mélyítés:* „Milyen egyéb eszközöket használnak? (Microsoft 365 vagy Google, tárhely, Excel-makrók, Billingo, Számlázz.hu, bankportál, aláírás)”
29. *Mélyítés:* „Ki az irodában az informatikai ügyek felelőse? Van külső informatikus?”

**Piros zászló:**
- Nincs exportlehetőség, vagy az export csak nyomtatható (PDF).
- A tulajdonos szerint „a programhoz senki ne nyúljon”.
- Felhős rendszer, amely zárt, és a szállító nem engedi az adatkiadást.

Ezek az integrációt teszik kockázatossá; a válaszokat szoftverenként összesítjük.

### I) Korábbi próbálkozások eszközökkel (2 perc)

30. **Az elmúlt 2 évben milyen új eszközt vagy szolgáltatást próbáltak ki a munka könnyítésére? Mi lett belőle?**
    - *Mélyítés:* „Mi alapján döntötték el, hogy marad vagy megy? Mennyi ideig tartott a bevezetés?”
    - *Mélyítés:* „Hallottak-e ezekről: ÜgyfélSegéd, Zeuss, Kulcs Connect, Optimato, Acounto, identiGO? Néztek-e valamelyiket?”
31. *Mélyítés:* „Használnak-e ChatGPT-t vagy más AI-eszközt az irodában? Mire? Van-e erre szabály?”

**Piros zászló:** két-három bevezetési kudarc után „soha többé új rendszert” hozzáállás. Ez nem kizáró ok, de ilyenkor csak „megcsináljuk helyetted” modell működhet.

### J) Döntéshozatal és költségkeret (3 perc)

32. **Az utolsó olyan szoftvert vagy szolgáltatást, amiért havidíjat fizetnek, ki választotta ki, és hogyan zajlott a döntés?**
    - *Mélyítés:* „Mennyi ideig tartott az első megkereséstől a szerződésig? Kellett-e társtulajdonos vagy könyvvizsgáló jóváhagyása?”

## 6. Opcionális megoldás-próba és elköteleződés-kérés (az utolsó kb. 5–10 perc)

## 8. Szintézis és döntés

### 8.1 Ötösével összegzés (60–90 perces közös ülés minden 5. interjú után)

1. **Hipotézistábla frissítése:** H1–H12 mindegyikénél megerősítő, cáfoló és bizonytalan esetek száma, interjúkóddal. Példa: „H1: 3 megerősít (I-01, I-03, I-05), 1 cáfol (I-02), 1 bizonytalan”.
2. **Fájdalom-hőtérkép:** sorokban az interjúk, oszlopokban (a)/(b)/(d)/(c)/(e: bérszámfejtés)/egyéb, cellákban a pontszám. Mely szegmensben magas mi?
3. **Szoftvertérkép:** programonként hány iroda használja, látott-e exportot, milyen formátumot.
4. **Idézetfal:** a legerősebb 10 idézet, fájdalom szerint csoportosítva. Ezekből lesz később az ajánlat szövege.
5. **Kérdéssor módosítása:** mi nem működött, mit kell élesíteni, mit lehet elhagyni. Az elhangzó új fájdalmakat (például bérszámfejtés, KATA 2027-es ügyfélhullám) új hipotézisként vesszük fel.
6. **Kvóta-ellenőrzés:** melyik szegmens hiányzik? A következő megkereséseket ennek megfelelően választjuk a top 20-ból és a tartalékból.
7. **Torzítás-ellenőrzés:** a meleg bemutatású interjúk udvariasabbak lehetnek. A meleg és a hideg alanyok pontszámait külön is nézzük meg.

**Az 5. interjú utáni gyors fordulópont:** ha az első 5-ből egynél sem jön ki ≥ 4-es fájdalom sem (b)-re, sem (d)-re, a 6–10. interjúkban a B blokkot (havi ciklus) bővítjük, és nyitottan keressük, mi a valódi fő fájdalom. Ilyenkor a makettet nem mutatjuk.

### 8.2 Döntési kritériumok (a 7–8. hét végén, 15–20 interjú után)

| **GO (b)-vel** | (1) Az interjúk ≥ 40%-ában a (b) fájdalom ≥ 4; (2) legalább 3 iroda ≥ 4. szintű elköteleződése (LOI árral vagy fizetett pilot) (b)-re, ebből **legalább 1 fizetett pilot**; (3) legalább 2 különböző könyvelőprogramból látott, használható export; (4) a tesztelt árpontok közül legalább a középsőt (B) senki nem utasította el reflexből a pilotjelöltek közül. |

## 10. Jogi és etikai megjegyzések

> Ez a fejezet gyakorlati ellenőrzőlista, nem jogi tanács. A szerződéseket és az adatkezelési dokumentumokat ügyvéddel kell véglegesíteni (lásd a stratégiai jelentés 6–12. heti lépését).

### 10.1 A fejlesztő munkaszerződésének ellenőrzése (**az első megkeresés előtt**)

- **Versenytilalmi és összeférhetetlenségi kikötés:** érinti-e a munkáltató tevékenységi körét vagy ügyfélkörét egy könyvelőirodáknak szóló automatizálási szolgáltatás? Van-e a munkáltatónak könyvelőiroda-ügyfele vagy könyvelési szoftverterméke?
- **Mellékfoglalkozás vagy más jogviszony bejelentési vagy engedélyezési kötelezettsége:** egy saját Kft.-ben vállalt tulajdonosi és munkavégzési szerep is ide tartozhat.
- **Szellemi tulajdon:** a munkaszerződés kiterjed-e a munkaidőn kívül, saját eszközzel készült fejlesztésekre? Semmit ne fejlesszünk a munkáltató gépén, fiókján, idejében, és a munkahelyi e-mailt se használjuk.
- **Titoktartás:** a munkáltató ügyfeleinek adatai és megoldásai nem kerülhetnek a Kft.-be.
- Eredmény: írásos „zöld jelzés” (ügyvédtől vagy a munkáltatótól). Ha nincs meg, az interjúkat az értékesítő vezeti, a fejlesztő pedig csak jegyzetel, és nem a saját nevén keres meg senkit, amíg ez nem tisztázott.

### 10.2 Titoktartás (NDA) és adatminták kezelése

- **Az interjúhoz nem kell NDA,** mert ügyféladatot nem kérünk. Kérjük az alanyt, hogy ne mondjon ügyfélnevet vagy adószámot. Ha mégis elhangzik, a jegyzetből kihagyjuk.
- **Adatminta (3. szint) előtt:** egyoldalas, **kölcsönös titoktartási megállapodás**. Tartalma: a cél (kizárólag a megvalósíthatóság vizsgálata), a megőrzés (legfeljebb 60 nap, utána igazolt törlés), harmadik félnek nem adható tovább, és nem használható modelltanításra.
- **Az adatminimalizálás sorrendje**, mindig a legkisebb szükséges lépéssel:
  1. Képernyőn mutatja, mi nem kapunk adatot.
  2. **Szintetikus vagy anonimizált export:** az iroda kicseréli az ügyfélnevet, az adószámot, a bankszámlaszámot és a személyneveket. Ebben segítünk egy egyszerű útmutatóval, de az anonimizálást ő végzi.
  3. **Valódi ügyféladat** csak fizetett pilotban, **adatfeldolgozói szerződéssel (GDPR 28. cikk)**. Az iroda az adatkezelő, a Kft. az adatfeldolgozó, egy esetleges LLM-szolgáltató pedig al-adatfeldolgozó, csak ha a szerződés ezt kifejezetten engedi.
- **Pmt.-adatok:** személyazonosító okmány-másolatot és tényleges tulajdonosi adatot interjú vagy pilot előtt **semmilyen formában ne vegyünk át**. A (d) próba csak struktúrát mutat (milyen mezők, milyen hiányok), valódi okmányt nem.
- **Technikai szabályok:**
  - titkosított, EU-ban tárolt, hozzáféréssel korlátozott tárhely;
  - ügyféladat nem kerülhet fogyasztói AI-felületre (ingyenes ChatGPT és hasonlók);
  - LLM-et csak olyan céges API-n keresztül használunk, amely nem tanít az adaton, és van adatfeldolgozói feltétele;
  - minden adathozzáférést naplózunk.
- **Könyvelői titoktartás:** a könyvelőt titoktartási kötelezettség köti az ügyfelei felé, és a Pmt. is előír titoktartási és adatmegőrzési szabályokat. Nem kérhetünk tőle olyat, amivel ezt megsértené. Ha egy iroda „csak úgy” odaadná a teljes adatbázisát, ne fogadjuk el.

### 10.3 Az interjúalanyok adatai

- Egy rövid **adatkezelési tájékoztató** (fél oldal), az első e-mailben linkként vagy mellékletként. Tartalma:
  - ki az adatkezelő (a Kft.), milyen adat (név, elérhetőség, interjújegyzet, felvétel), milyen célra (piackutatás);
  - jogalap: hozzájárulás vagy jogos érdek;
  - megőrzés: a felvétel legfeljebb 30 nap, a jegyzet a kutatás végéig, illetve legfeljebb 12 hónap, ha további kapcsolatot kért;
  - törlési jog, és a NAIH mint felügyeleti hatóság.
- A felvételt csak kifejezett hozzájárulással készítjük (4.3), és a hozzájárulást rögzítjük.
- Idézni csak névtelenül szabad; az anonim összefoglalóban egyetlen iroda se legyen felismerhető.
- A toborzási adatokra a 3.4 vonatkozik: üzleti elérhetőség, nincs tömeges levél a PM-névjegyzékből, leiratkozási lehetőség.

### 10.4 Nem adunk adótanácsot

- Az adótanácsadói tevékenység nyilvántartásba vételhez kötött. A Kft. **nem ad adó-, számviteli vagy Pmt.-jogi tanácsot**, sem az interjún, sem az ellenőrzőlistában, sem a makettben.
- Ha az alany adókérdést tesz fel („ezt hogyan kell az eÁFA-ban?”), a válasz: „Ebben nem vagyunk illetékesek. A NAV tájékoztatója vagy a szoftverszállító tud pontos választ adni.” Ez egyben jó adat is arról, hol bizonytalanok.
- Az ellenőrzőlista és minden anyag lábjegyzete: „Tájékoztató jellegű, nyilvános NAV-forrásokon alapul, nem minősül adótanácsadásnak; állapot: [dátum].”
- A (b) és a (d) ajánlat pozicionálása: **„jelzések emberi felülvizsgálatra”**, nem döntés. A bevallásért és a Pmt.-megfelelésért az iroda felel. Ezt a pilotszerződésben felelősségkorlátozással is rögzíteni kell (a stratégiai jelentés szerint például a 12 havi díjig).

### 10.5 Etikai alapszabályok

- **Az „interjú, nem eladás” ígéretet betartjuk.** Ha a megoldás-próba után az alany nem kér többet, nem küldünk ajánlatot.
- A meleg bemutatásnál nem használjuk ki a közös ismerőst vagy az ügyfélkapcsolatot nyomásgyakorlásra (például: „az ügyfele is ezt szeretné”).
- Versenytársakról tényszerűen beszélünk, nem becsmérelünk (ÜgyfélSegéd, Zeuss, Optimato, identiGO, Acounto).
- Az érdemi információkat (például egy iroda belső folyamatát) más irodának nem adjuk tovább, csak anonim, összesített formában.
- Ha a beszélgetésben jogsértésre utaló információ hangzik el (például valaki szándékosan nem végez ügyfélátvilágítást), nem kommentáljuk és nem rögzítjük azonosítható formában. A kutatásban nem vagyunk sem hatóság, sem tanácsadó.

A táblázat két mintázatot mutat. Az első: **a fizetőképesség (4. oszlop) szinte mindenhol 3 vagy alacsonyabb**, ami tükrözi az előző kutatás megállapítását, hogy egy átlagos 5-249 fős magyar cég havi IT-költése kb. 100 ezer Ft körüli, így egy 150-300 ezres havidíj csak megspórolt munkaórában kifejezve adható el. A második: ahol a gyenge AI-verseny pont alacsony (fogászat, társasház, NIS2, jog), ott a szoftvergyártók már beépítik az AI-t, és egy kétfős cég csak partnerként léphet be. A három holtversenyes vertikum között a döntő a helyi egyediség és a dokumentumok jellege: a vámügyben a dokumentumok többnyelvűek, rendezetlenek és határidőkritikusak, és a hiba azonnal mérhető (órás várakozás a határon), ami a legerősebb ROI-érvet adja.

## Vámügynökségek és szállítmányozók: Röszke a legszegedibb fájdalom

**Miért ez az első.** Röszke az EU és Szerbia közötti külső határ, ahol a kamionforgalom rendszeresen akad el. 2026 augusztusában **8-10 órás várakozásról** írtak ([Origo 2026-08](https://www.origo.hu/belpol/2026/08/roszke-hataratkeles-varakozas-kaosz)), 2026 januárjában pedig kamionblokád zárta le Röszkét, Tompát és Hercegszántót a teherforgalom elől ([Index 2026-01](https://index.hu/belfold/2026/01/23/magyarorszag-szerbia-roszke-tompa-hercegszanto-hatar-atkelo-teherforgalom-korlatozas-lezaras/); [Szegedma 2026-01](https://szegedma.hu/tersegi-hirek/2026/01/kamionblokad-teherforgalom-roszke-hatar-lezaras)). Egy gyakorlati útmutató szerint egyes napokon **akár 2000 kamion is várakozik** Tompánál és Röszkénél, és gyakran érkeznek kamionok előzetes belépési gyűjtő árunyilatkozat (ENS) nélkül, ami azonnali vámellenőrzést vált ki. A T1 tranzit plombával szigorúbb ellenőrzést és előre felkészített vámügynököt igényel (snippet, ellenőrizendő; a forrás egy kereskedő blogja, [kamionshopkft.hu](https://www.kamionshopkft.hu/hataratlepes-es-vamkezeles-kamionnal)). Erre jön rá a BYD-hez kapcsolódó logisztika. A METRANS kb. 6 milliárd Ft-os, 860 millió Ft állami támogatással épülő kiskundorozsmai terminálja **évi 300 ezer TEU** kapacitásra és napi 6 vonatpárra készül 2027-re ([Magyar Építők 2025-12](https://magyarepitok.hu/mi-epul/2025/12/europa-egyik-legmodernebb-logisztikai-terminalja-epul-szegeden-a-byd-gyar-mellett); [magyarvasut.hu](https://magyarvasut.hu/uj-intermodalis-kontenerterminal-epul-szegeden-elindult-a-metrans-csoport-300-000-kontener-ev-kapacitasu-beruhazasa/)), a BYD pedig **napi kb. 1000 autóval számol, ebből kb. 700-at vasúton szállítana el** ([szeged365 2026-07](https://szeged365.hu/2026/07/13/a-byd-szegedi-gyaraban-naponta-varhatoan-1000-auto-keszul-majd-amelyek-kozul-mintegy-700-at-vasuton-szallitanak-el/)).

**A magyar rendszerkötődés erős és éppen most változik.** Az importnyilatkozatokat 2024. január 1. óta az eVÁM dolgozza fel a CDPS helyett, és a rendszer 24 óra alatt akár 500 ezer nyilatkozatot képes kezelni ([Andersen](https://hu.andersen.com/hu/hirek/parkolopalyan-a-cdps-szervusz-evam/)). **2026. július 31-től bizonyos elektronikus nyilatkozatoknál automatizált, vámtiszti közreműködés nélküli döntéshozatal is megengedett** ([iriszoffice.hu](https://iriszoffice.hu/egypercesek/gyorsabba-valhat-a-vameljaras-ujabb-lepes-az-adminisztracio-csokkentese-fele/); [NavigátorVilág](https://navigatorvilag.hu/hir/mvsz-2/)). A NAV 2026-os ellenőrzési terve AI-támogatott kockázatelemzésre épül, és a vámterületen az EU-n kívüli kereskedelemre, a szankciós megfelelésre és a termékbiztonságra koncentrál ([NAV](https://nav.gov.hu/sajtoszoba/hirek/Vagujhelyi_Ferenc_a_kockazatelemzes_es_mesterseges_intelligencia_tamogatta_kivalasztasra_epulnek_a_2026-os_ellenorzesek)). A kettő együtt azt jelenti, hogy **a tiszta, hiánytalan bemeneti adat értéke nő**: ami jól van kitöltve, gyorsabban átmegy, ami hibás, azt a NAV algoritmusa nagyobb eséllyel kiemeli.

**Kulcs-munkafolyamatok.** A vámügynökségnél a kereskedelmi számlák, csomaglisták és CMR-ek (gyakran szerb, angol, kínai nyelvű PDF-ek, e-mailek, fotók) átalakítása eVÁM/NCTS/ENS nyilatkozattervezetté, vámtarifaszám-javaslattal, valamint egy „határ előtti ellenőrzés”, amely jelzi, ha a kamion ENS nélkül indulna Röszke felé. A szállítmányozónál az e-mailben és WhatsAppon érkező ajánlatkérések kinyerése, árajánlat-tervezet és megrendelés létrehozása a használt fuvarszervező rendszerben. A fuvarozónál a sofőröktől érkező CMR-fotók számlázáshoz kötése, a kiküldetési és Mobilitási Csomag szerinti papírmunka és az e-útdíj számlák egyeztetése (az utóbbi két kötődés következtetés, ebben a körben nem ellenőriztük forrásból).

**Versenytársak.** A hazai inkumbensek nem AI-dokumentumfeldolgozók. A SpediTrans szállítmányozói és fuvarozói szoftver kb. 300 céggel, 20 éves múlttal, megrendelés-kezeléssel és többnyelvű visszaigazolással ([speditrans.hu](https://www.speditrans.hu/)), a GLI Solutions útvonaltervezést kínál ([Műszaki Magazin](https://www.muszaki-magazin.hu/2022/01/26/fuvareszervezes-optimalizalas-gli/)). **Magyar AI-startupot fuvarlevél-, ajánlat- vagy vámdokumentum-automatizálásra nem találtunk.** Ez nem jelenti, hogy nincs: a nagy nemzetközi szállítmányozók saját rendszereket használnak, és nemzetközi vámszoftver-gyártók is jelen lehetnek, amit ez a kör nem vizsgált.

**Kockázatok.** A fuvarozók gazdasága gyenge: 2022 óta a cégek kb. 9-10%-a lépett ki a piacról, és 2025 első negyedévében **nagyjából a felük veszteséges** volt (snippet, ellenőrizendő; [Transpack 2025-09](https://transpack.hu/2025/09/26/logisztika-csokken-fuvarozasi-vallalkozasok-szama/); [VG 2025-02](https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2025/02/fuvarozo-kamion-digilog-kfx)). Ezért a tiszta fuvarozó vevőként gyenge (saját becslés szerint havi 50-150 ezer Ft), a vámügynökség és a szállítmányozó erősebb (havi 150-400 ezer Ft, szintén becslés). A második kockázat a felelősség: egy hibás vámtarifaszám-javaslat adó- és bírságkockázatot hordoz, ezért a termék csak tervezetet adhat, a nyilatkozatot a vámügynök írja alá. A harmadik a technikai belépés: nem ellenőriztük, milyen tanúsítás vagy interfész kell az eVÁM-hoz való közvetlen beküldéshez, ezért az első verzió a meglévő vámszoftver felé ad kitöltött adatot, nem közvetlenül a NAV felé. Végül az AI nem oldja meg a röszkei fizikai kapacitáshiányt, csak a dokumentumhiányból eredő többletellenőrzést csökkentheti; az értékesítésben ezt nem szabad túlígérni.

**Első validációs lépés.** Az értékesítő hálózatán keresztül **5 szegedi és röszkei vámügynökséggel vagy szállítmányozóval** egy-egy órás interjú, amelynek kérdése: hány nyilatkozatot készítenek havonta, egy nyilatkozat hány percig tart, és milyen gyakran akad el kamion dokumentumhiány miatt. A végén kérjenek **20-30 anonimizált, valós dokumentumcsomagot**, amelyen a fejlesztő két hét alatt, egyszerű LLM-alapú kinyeréssel lemérik a mezőpontosságot. Sikerkritérium: legalább 80%-os mezőpontosság a kulcsmezőkön, és legalább két cég, amely fizetett pilotra (például 300-600 ezer Ft setup + havidíj) szándéknyilatkozatot ad.

## Agrár-élelmiszeripar: a szövetkezetnek kell eladni, nem a gazdának

**Miért ez a második.** Csongrád-Csanád megye 62 406 regisztrált vállalkozásának kb. 34%-a mezőgazdasági regisztrációjú (snippet, ellenőrizendő; [KSH gsz0063](https://www.ksh.hu/stadat_files/gsz/hu/gsz0063.html); [KSH megyei jelentés](https://www.ksh.hu/docs/szolgaltatasok/adatigenyles/csongrad_csanad_varmegye_gazdasagi_helyzetenek_alakulasa.pdf)). A szentesi DélKerTÉSZ 2025 első három negyedévében **53,5 ezer tonna zöldséget értékesített 16,5 milliárd Ft értékben**, a tagok 10 hektárral bővítenek, és további 60-70 hektár üvegház épülhet, de a beruházást a munkaerőhiány fékezi, és az egyszerűsített foglalkoztatás 120 napos korlátjának szűkítése nehezíti a szezonális munkaerő felvételét ([Magyar Mezőgazdaság 2025-11](https://magyarmezogazdasag.hu/2025/11/26/tovabb-novekszik-a-szentesi-szovetkezet/); [Agroinform](https://www.agroinform.hu/kerteszet_szoleszet/legyen-vendegmunkas-kulonben-leallnak-a-kerteszeti-beruhazasok-93991-001)). Országosan közel 4000 élelmiszeripari vállalkozás működik, a feldolgozóipar harmadik legnagyobb ága kibocsátás szerint, és digitalizációja korlátozott, főként a logisztikára, a készletre és az adminisztrációra szorítkozik ([Magyar Mérnökakadémia 2025](https://mernokakademia.hu/hu/wp-content/uploads/2025/04/elelmiszeripari_digitalizacio.pdf)). Ez a vertikum egyszerre maximális munkaerőhiány-pontszámú és maximális szegedi illeszkedésű.

**Pontosítás az előző kutatáshoz képest.** Az előző jelentés a KAP egységes kérelmeket a kerülendő területek közé sorolta, mert a kérelmek kb. 71%-a a NAK falugazdászain keresztül megy. Ez továbbra is igaz: **a kérelembeadás nem a célpont.** A célpont a sok gazdát összefogó szervezetek háttérirodája: szövetkezetek, elismert termelői szervezetek (TÉSZ, megyei listájuk [itt](https://agrikonzult.hu/wp-content/uploads/2025/02/elismert_zoldseg_gyumolcs_termeloi_szervezetek_20230718.pdf)), integrátorok és a NAK nyilvántartásában szereplő magán szaktanácsadók. A NAK szaktanácsadói névjegyzéket vezet, és a 2025-ben belépett tanácsadóknak 2026-ban képzést és vizsgát kell teljesíteniük ([NAK ESZNR](https://www.nak.hu/hatosagi-szakmai-ugyek/szaktanacsadas/34-esznr)).

**Kulcs-munkafolyamatok.** A szövetkezeti háttérirodában a tagok szállítóleveleiből és minőségi osztályba sorolási adataiból tagi elszámolás készítése, valamint a kiskereskedelmi láncoktól érkező rendelések (EDI, e-mail) feldolgozása. A nyomonkövetés és tanúsítás oldalán a GlobalG.A.P., HACCP és IFS/BRC nyilvántartások, a permetezési napló bejegyzéseinek hangból vagy fotóból készített tervezete, és az audit előtti dokumentumcsomag összeállítása. A HACCP-kézikönyv élelmiszer-előállításhoz, -szállításhoz és vendéglátáshoz kötelező ([megvedelek.hu](https://megvedelek.hu/felir-szam-es-haccp/)). A harmadik terület a szezonális munkaerő adminisztrációja (az egyszerűsített foglalkoztatás bejelentései a 120 napos korláttal összefüggésben) és a szaktanácsadóknál a KAP/MePAR-dokumentumok begyűjtése a gazdáktól. A feldolgozókhoz (Pick, Sole-Mizo típusú cégek) a minőségügyi dokumentáció továbbértékesítésként vihető, amelyet külön 22 pontra értékeltünk: magasabb a fizetőképesség, de gyengébb a kifejezetten magyar rendszerkötődés.

**Versenytársak.** Online HACCP-naplózásra létezik magyar SaaS (DIHA, [diha.hu](https://diha.hu/)), de árát nem sikerült lekérni. Azt sem derítettük ki, milyen gazdálkodási szoftvereket használnak a szövetkezetek. Kifejezetten AI-alapú szövetkezeti vagy tanúsítási dokumentum-automatizálást nem találtunk. A szaktanácsadói piacon az állami NAK-hálózat a domináns szereplő, ami a magánszaktanácsadók mozgásterét szűkíti.

**Kockázatok.** A szezonalitás kétélű: a csúcs (tavaszi kérelemidőszak, nyári betakarítás) idején a vevőnek nincs ideje bevezetésre, a téli hónapok viszont alkalmasak a tárgyalásra. A második kockázat a szakmai hitelesség: egy szövetkezeti vezető nem fog „AI-céggel” tárgyalni, ha az nem érti a permetezési napló vagy a tagi elszámolás logikáját, ezért agrárszakmai partner vagy referencia kell. A harmadik a vendégmunkás-szabályozás 2026-os változása (lásd az ötödik vertikumnál), amely a munkaerő-adminisztráció termékét kiszámíthatatlanná teszi. A fizetőképesség saját becslés szerint szövetkezetnél és feldolgozónál havi 150-500 ezer Ft, szaktanácsadónál 50-150 ezer Ft szezonális csúcsokkal.

**Első validációs lépés.** **Novemberben és decemberben**, a szezonon kívül, az értékesítő meleg bemutatásával egy-egy interjú a DélKerTÉSZ vagy egy másik szentesi–szegvári szövetkezet ügyvezetőjével és pénzügyi vezetőjével, továbbá 2-3 NAK-nyilvántartott magánszaktanácsadóval. A cél egyetlen folyamat teljes feltérképezése a beérkező papírtól a kimenő elszámolásig, munkaórában kifejezve. Ha a tagi elszámolás vagy a tanúsítási csomag havonta legalább 40-60 munkaórát visz el, a következő lépés egy szezonra szóló fizetett pilot egyetlen munkafolyamatra. Sikerkritérium: egy aláírt pilot a 2027-es szezon előtt, és egy szakmai partner (szaktanácsadó vagy agrármérnök), aki a Kft nevében is beszél.

## Építőipar: szigorodó e-napló és alvállalkozói lánc a BYD-projektek körül

**Miért a harmadik.** Az építőipar a legnagyobb bázis: 2025 végén **149,5 ezer regisztrált gazdasági szervezet**, a működő cégek száma pedig a 2022 végi 61,5 ezerről 2026 augusztusára **56,6 ezerre csökkent** (snippet, ellenőrizendő; [hirnavigator/KSH](https://hirnavigator.hu/hir/10782636-a-regisztralt-gazdasagi-szervezetek-szama-az-epitoiparban-grafikon); [Portfolio 2026-09](https://www.portfolio.hu/ingatlan/20260909/a-kapacitas-keszen-all-mar-csak-a-fellendulesre-var-az-epitoipar-861420)). A szabályozási nyomás erős. 2025-ben a munkaügyi hatóság 1885 építőipari céget ellenőrzött, **67,9%-uknál talált szabálytalanságot, és a munkavállalók 82,2%-a szabálytalan foglalkoztatásban** dolgozott ([Infostart 2026-09-14](https://infostart.hu/gazdasag/2026/09/14/koji-laszlo-az-arenaban-az-epitoiparban-822-szazalekos-a-problematikus-foglalkoztatottsag)). Az e-építési napló 2026-ban több ponton változott: április 1-jétől új naplótípusok tervezési szerződésekhez, februárban szerepkör-átnevezés, az alvállalkozói szerződésekben kötelező feltüntetni a fővállalkozó nyilvántartási számát, és szeptember végétől megújult mobilalkalmazás ([e-epites.hu](https://www.e-epites.hu/hirek/e-epitesi-naplo/tajekoztato-az-e-epitesi-naplo-alkalmazast-erinto-valtozasrol); [MEK 2026-01](https://mek.hu/link-ekm_tajekoztato_az_epitesugyi_targyu_kormanyrendeletek_modositasarol_2026_januar_8); [BPMK 2026](https://bpmkkepzesek.hu/images/2026/BPMK_E-NAPLO_2026.04_-ki.2.pdf)). Minden kivitelezőnek szerepelnie kell az MKIK kivitelezői nyilvántartásában ([MKIK GYIK](https://mkik.hu/epitoipari-kivitelezo-vallalkozasok-gyik)). A szegedi keresletet a BYD-gyár bővítése, a METRANS-terminál, a Szeged–Röszke vasútprojekt ([MÁV](https://www.mavcsoport.hu/mav-csoport/szeged-roszke-projekt)) és az ipari park útfejlesztései adják, amelyek sok alvállalkozói láncot hoznak a megyébe.

**Kulcs-munkafolyamatok.** Az első a napi e-napló bejegyzések tervezete a művezető hangüzeneteiből és fotóiból, amelyet a felelős műszaki vezető hagy jóvá. A második az alvállalkozói megfelelési csomag: MKIK-nyilvántartás ellenőrzése, a NAV köztartozásmentes adatbázisának lekérdezése, munkavállalói listák, A1- és kiküldetési igazolások, valamint a szerződési lánc a fővállalkozó nyilvántartási számával. A harmadik az ajánlati dokumentáció összeállítása az EKR-ben (elektronikus közbeszerzési rendszer) és a költségvetések összehasonlítása. A 2026-os közbeszerzési értékhatárok változatlanok: klasszikus ajánlatkérőknél építési beruházásra 60 millió, szolgáltatásra 20 millió Ft ([Közbeszerzési Hatóság](https://kozbeszerzes.hu/kozbeszerzesek-az/magyar-jogi-hatter/elnoki-tajekoztatok/a-kozbeszerzesi-hatosag-elnokenek-tajekoztatoja-a-2026-januar-1-jetol-iranyado-kozbeszerzesi-ertekhatarokrol/)).

**Versenytársak.** E-napló bejegyzésekre vagy alvállalkozói dokumentum-ellenőrzésre szakosodott magyar AI-terméket nem találtunk. Közbeszerzés-figyelő AI-eszközből viszont legalább öt működik, ezért a tenderfigyelés önmagában nem javasolt (ezt az előző kutatás is rögzítette); a lehetőség az ajánlat *összeállítása*, nem a felkutatása. A helyi kamara már tart építőipari AI-rendezvényt („A mesterséges intelligenciától a BIM-ig”, [CSKIK](https://cskik.hu/a-mesterseges-intelligenciatol-a-bim-ig-a-jovo-epitesugyerol-tanacskoztak-szegeden/)), ami csatornaként és a kereslet jeleként is értelmezhető.

**Kockázatok.** A hangulat gyenge: a cégek újabb nehéz évre készülnek ([ÉVOSZ konjunktúra](https://evosz.hu/hirek/1148-konjunkturafelmeres2025ii); [Piac&Profit](https://piacesprofit.hu/cikkek/gazdasag/ujabb-nehez-evre-keszulnek-az-epitoipari-vallalatok-.html)). A digitális érettség alacsony, a mikrocégek nem fizetnek, ezért **csak 20 fő feletti generálkivitelezőt** érdemes célozni, ahol saját becslés szerint havi 150-400 ezer Ft reális. A második kockázat a felelősség: az e-napló bejegyzés jogi dokumentum, ezért a rendszer csak tervezetet készíthet, és a jóváhagyási láncot dokumentálni kell. Egy steelman-ellenérv: a szabálytalan foglalkoztatás magas aránya azt is jelentheti, hogy a cégek egy része nem akar átlátható alvállalkozói dokumentációt. A vevő ezért inkább a fővállalkozó, akit a lánc átláthatósága véd, nem a lánc alján lévő alvállalkozó.

**Első validációs lépés.** **5-8 interjú szegedi és megyei, 20-200 fős generálkivitelezővel**, elsősorban azokkal, akik a BYD-, METRANS- vagy vasútprojekteken dolgoznak. Az interjú mellett a fejlesztő töltsön el egy napot egy építésvezető mellett, és mérje meg, mennyi időt visz el az e-napló és az alvállalkozói papírmunka. Ezután két hétig kézzel előkészített tervezetekkel (hangüzenet → e-napló szöveg) tesztelhető, elfogadja-e a felelős műszaki vezető a minőséget. Sikerkritérium: legalább egy fizetett pilot havi 150 ezer Ft feletti díjjal, és a CSKIK-kel egy közös építőipari bemutató időpontja.

## Fogászat és bérszámfejtés: partnerként a meglévő szoftver fölött

### Magánfogászatok: bevételvisszaszerzés, nem újabb recepciós

**Miért a negyedik.** A NAV adatai szerint kb. **2600 fogászati vállalkozás** működik, ebből kb. 500 jelentős külföldi betegforgalommal, és Magyarország az európai fogászati turizmus kb. 40%-át adja évi 60-70 milliárd Ft értékben (régi, 2019-2021-es adatok, ellenőrizendő; [turizmus.com](https://turizmus.com/cikk/archiv/milliardos-uzlet-a-fogaszati-turizmus-palyazatok-fogaszatoknak)). A fogászati ellátás kb. kétharmadát a betegek saját zsebből fizetik ([medicalonline](https://medicalonline.hu/eu_gazdasag/cikk/a_fogorvosi_ellatasok_ketharmadat_sajat_zsebbol_fizetik_a_magyarok)), ami az egyik legjobb fizetőképességi pontszámot adja. A magyar kötődést az EESZT-adatszolgáltatás adja: a magánszolgáltatóknak kötelező, és a hatóság bírságot szabhat vagy visszavonhatja a működési engedélyt ([MEMT](https://memt.hu/eeszt-juniustol-kotelezo-a-maganszolgaltatoknak-az-adatszolgaltatas/); [pharmindex](https://www.pharmindex-online.hu/szakmapolitika/hirek-cikkek/eeszt-hol-tart-jelenleg-a-maganellatok-kotelezo-csatlakozasa)).

**Versenytársak és pozícionálás.** Itt a legsűrűbb a mező. EESZT-akkreditált praxisszoftverek: Flexi-Dent ([flexi-dent.hu](https://www.flexi-dent.hu/)), Cloudent ([cloudent.hu](https://www.cloudent.hu/)), DentRP ([dentrp.hu](https://dentrp.hu/)), DokiRex.NET ([kardi-soft.hu](https://kardi-soft.hu/)). Magyar AI-dokumentációs asszisztens is van: a MedAssist konzultációból ambuláns lap tervezetet készít, EESZT- és klinikaiszoftver-integrációt tervez ([MMOnline](https://mmonline.hu/cikk/magyar-ai-megoldas-segit-az-orvosoknak/)), az állam pedig iEESZT néven AI-réteget fejleszt az EESZT fölé ([hirlevel.egov.hu 2026-02](https://hirlevel.egov.hu/2026/02/28/ieeszt-mesterseges-intelligencia-alapu-rendszert-fejlesztenek-a-magyar-egeszsegugyben/)). A hangalapú AI-recepciós piacon legalább hat magyar szolgáltató van havi kb. 40 ezer Ft-tól. **Saját EESZT-akkreditált termék építése ezért önálló szabályozási projekt, és nem javasolt.** A rés az integrációs és szolgáltatói réteg: a visszahívások (recall) és az el nem fogadott kezelési tervek utánkövetése, a többnyelvű (német, angol, szerb) fogászati turista érdeklődők kezelése a panorámaröntgen alapú ajánlattól az utókezelésig, valamint az ambuláns lap és betegtájékoztató tervezete a klinika meglévő szoftverébe, emberi jóváhagyással. Azt, hogy az el nem fogadott kezelési terv a klinikák legnagyobb bevételvesztése, ebben a körben nem ellenőriztük forrásból; ezt az első validációnak kell igazolnia.

**Kockázatok.** Az egészségügyi adat különleges adat, ami szigorúbb GDPR-követelményeket és adatfeldolgozói szerződést jelent. A szoftvergyártók bármikor beépíthetik ugyanezt a funkciót. A fizetőképesség szórása nagy: saját becslés szerint egy implantológiai és turisztikai klinika havi 150-400 ezer Ft-ot fizethet, egy egyszékes rendelő csak 30-80 ezret. Szegedi előny a szerb betegek határon átnyúló forgalma és az SZTE fogorvoskari végzettjeinek hálózata, de a szegedi magánklinikák számát nem sikerült megállapítani.

**Első validációs lépés.** **5 szegedi implantológiai vagy turisztikai profilú klinika**: melyik praxisszoftvert használják, van-e export vagy API, és mennyi volt az elmúlt 12 hónapban kiadott, de el nem fogadott kezelési tervek száma és értéke. Ha ez klinikánként milliós nagyságrendű, egy sikerdíjas pilot (a visszaszerzett bevétel százaléka) a legkönnyebben eladható ajánlat. Párhuzamosan érdemes megkeresni a Flexi-Dent, a Cloudent és a DentRP partnerprogramját, mert egy szoftvergyártói partnerség az egész országos ügyfélkört megnyithatja.

### Bérszámfejtés és külföldi munkavállalói megfelelés: a könyvelői csatorna meghosszabbítása

**Miért az ötödik.** Ez a könyvelőirodák legközelebbi szomszédja: ugyanaz a vevő, gyakran ugyanaz a cég, ugyanazok a NAV-kötődések (08-as bevallás, T1041 biztosítotti bejelentés, gyakori szabályváltozás). A 2026-os árak létszámalapúak: jellemzően **3000-5842 Ft/fő/hó**, 1-5 fős ügyfélnél 3000-5000 Ft, egyes szolgáltatóknál 2400 Ft-tól vagy TB-ügyintézéssel együtt 6500 Ft-ig (snippet, ellenőrizendő; [joszaki bérszámfejtés árak 2026](https://joszaki.hu/arak/berszamfejtes#page=3); [payroll.hu](https://payroll.hu/view.php?link=berszamfejtesi_dijak)). Egy havi 500 bérjegyzéket készítő iroda így havi kb. 1,5-2,5 millió Ft árbevételt ér el, amelyből egy havi 100-200 ezer Ft-os automatizálási díj elfogadható (saját számítás).

**A külföldi munkavállalói szál.** A munkaerő-kölcsönzők önálló vertikumként csak 21 pontot kaptak, mert a piac zsugorodik: a nagyobb kölcsönzőknél a kölcsönzött munkavállalók száma 2023 és 2024 között kb. 235 ezerről 201,5 ezerre csökkent (snippet, ellenőrizendő; [HR Portál 2025-08](https://www.hrportal.hu/hr/igy-allnak-letszamban-a-munkaero-kolcsonzo-cegek-20250801.html)), a minősített kölcsönbeadói státuszhoz pedig legalább 1000 fő kell ([jobtain.hu](https://jobtain.hu/mit-jelent-ma-magyarorszagon-minositett-munkaero-kolcsonzonek-lenni/)). A döntő tényező azonban a 2026-os politikai fordulat: **2026. június 6-tól új vendégmunkás-tartózkodási engedély nem kérhető**, a meglévők meghosszabbíthatók, a foglalkoztatási célú tartózkodási engedély megmaradt, de grúz, örmény és fülöp-szigeteki állampolgárok számára kizárt ([Telex 2026-06-05](https://telex.hu/gazdasag/2026/06/05/vendegmunkas-torveny-orszaglista-szigoritas-eltorles-fulop-szigetek); [Deloitte](https://www.deloitte.com/hu/hu/services/tax/perspectives/fontos-valtozasok-a-vendegmunkasok-foglalkoztatasara-vonatkozo-szabalyokban.html)). A hatás vitatott: a Világgazdaság szerint a fülöp-szigeteki munkavállalók más engedélytípusokon továbbra is érkeznek ([VG 2026-07](https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/07/vendegmunkasstop-fulop-szigetek-magyar-peter)). A külföldi munkavállalók bejelentési szabályai 2025-től szigorodtak ([HR Portál 2025-03](https://www.hrportal.hu/hr/kulfoldi-munkavallalok-bejelentese-valtozo-szabalyok-fontos-tudnivalok-20250319.html)). Ez a volatilitás egyszerre kockázat és kereslet: a **munkáltatóknak** (BYD-beszállítók, kertészetek) folyamatos megfelelési munkát ad egy változó szabályrendszerben. Vendégmunkás-adminisztrációra szakosodott magyar szoftvert nem találtunk, csak ügyvédi irodákat és közvetítőket ([overseaslabour.hu](https://overseaslabour.hu/kulfoldi-munkaero-alkalmazas-2026-magyarorszag/)).

**Kulcs-munkafolyamatok és kockázatok.** A bérirodánál a jelenléti ívek és távollétek bekérése az ügyfelektől (e-mail, Excel, fotó), a T1041 be- és kijelentések előkészítése, a bérjegyzékkel kapcsolatos munkavállalói kérdések megválaszolása és az igazolások tervezete. A munkáltatónál az engedélyek, orvosi alkalmassági vizsgálatok és szállásigazolások lejáratának követése, valamint többnyelvű betanítás és munkavállalói kérdés-válasz. A fő kockázat, hogy a szabályok 2024-ben, 2025-ben és 2026 júniusában is változtak, így **csak olcsón frissíthető szabálymotorral** védhető a termék. A bérszámfejtő szoftverek (Nexon, Kulcs-Bér) AI-ütemtervét nem vizsgáltuk, ami a könyvelőprogramoknál látott inkumbens-kockázat itteni megfelelője lehet. Ráadásul a bérszámfejtők nincsenek a legsúlyosabb hiányszakmák között (snippet, [HR Portál 2026-01](https://www.hrportal.hu/hr/elfogynak-a-dolgozok-magyarorszagon-durva-szamok-a-2026os-munkaeropiacrol-20260119.html)), ami gyengíti a munkaerő-kiváltási érvet.

**Első validációs lépés.** Nem kell külön interjúsorozat: a könyvelőirodákkal már tervezett 15-20 interjúba **öt bérszámfejtési kérdést** kell beépíteni (hány bérjegyzék, milyen formában jön a jelenléti adat, hány órát visz el a bekérés). Emellett **3 BYD-beszállító vagy kertészet HR-vezetőjével** kell beszélni arról, hogyan követik most a külföldi munkavállalók engedélyeit és határidőit. Sikerkritérium: legalább 3 iroda nevezi meg a jelenléti adatok bekérését fő időrablónak, és legalább egy munkáltató fizetne engedélykövetésért.

## Második vonal: ahol az inkumbens már beépítette az AI-t

A **NIS2-megfelelés** erős és ismétlődő kötődés: a SZTFH nyilvántartásában 2520 auditkötelezett szervezet szerepel, ebből 2132 teljesítette határidőre az első auditot, és az audit kétévente ismétlődik ([ictglobal.hu](https://ictglobal.hu/rovid-hirek/nis2-audit-2026-sztfh-eredmenyek/); [veszpremikamara.hu](https://veszpremikamara.hu/nis2-tajekoztato)). A virtuális információbiztonsági vezetői szolgáltatás havi 530-2100 euróba kerül (snippet, versenytárs saját anyaga; [appforge.hu](https://appforge.hu/en/nis2-compliance/)). A mező azonban zsúfolt: Big4, ügyvédi irodák, IT-integrátorok és AI-ra épülő NIS2-szolgáltatók (nis2ai.hu, AZAR). A kötelezettek ráadásul közép- és nagyvállalatok. A Kft-nek **továbbértékesítésként** érdemes kezelnie, elsősorban a NIS2-kötelezett nagyvállalatok beszállítóinak, akiknek kérdőíveket kell kitölteniük. A **társasházkezelők** piaca nagy (kb. 1,5 millió lakás társasházban, [Economx](https://www.economx.hu/magyar-gazdasag/kozos-kepviselo-ingatlanugyi-hatosag-nyilvantartas.788334.html)), de az eHÁZ minden kezelőjének ingyen adja a THT jogi AI-asszisztenst, és lakói AI-ügyfélszolgálatot tesztel ([THT](https://www.tht.hu/hirek/mesterseges-intelligencia-a-tarsashazkezelesben-elindult-az-ehaz-jogi-ai-asszisztens-es-jon-a-lakoi-ugyfelszolgalat-is/2909)), a Thaz-SofT pedig már 99 ezer Ft-os örökös licencben ad AI e-mail- és hangasszisztenst (snippet, [tarsashazaink.hu](https://tarsashazaink.hu/)). Itt csak a szoftver fölötti „megcsináljuk helyetted” réteg (lakói levelek, közgyűlési jegyzőkönyv, hátralékkezelés fizetési meghagyásig) vagy szoftvergyártói partnerség jöhet szóba.

A **biztosítási alkuszok** gazdagok (2024-ben 158 milliárd Ft jutalék, [Portfolio 2026-05](https://www.portfolio.hu/uzlet/20260507/hasitanak-a-magyar-biztositasi-alkuszok-lelegzet-visszafojtva-varjak-az-uj-kormany-donteseit-835250)), de kevesen vannak (kb. 333 független közvetítő, a források egymásnak ellentmondó számokat adnak, [solidium.hu](https://solidium.hu/milyen-a-fuggetlen-biztositaskozvetito-szektor-helyzete-a-2024-es-mnb-adatok-alapjan/)), és az EndlessCRM, az INSURA-hálózat és a MiniCRM már lefedi az eszközréteget. Az IDD szerinti igényfelmérés hívásfelvételből készített dokumentációja érdekes rés, de nem szegedi előny. Az **autószervizek** súlyos munkaerőhiánnyal küzdenek (a független szervizek 10-es skálán 8,36-ra értékelik a dolgozók pótlásának nehézségét, régebbi adat, [Autótechnika](https://autotechnika.hu/cikkek/jogszabalyok/14100/iparagi-felmeres-a-magyar-fuggetlen-autoszervizek-koereben)), de gyenge a szabályozási kötődés és a fizetőképesség. A BYD regionális márkakereskedői és szervizhálózata később ezen változtathat. Az **önkormányzatok**, az **autósiskolák**, az **állatorvosok**, az **ingatlanirodák** és a **temetkezési szolgáltatók** 14-16 pontot kaptak: vagy lassan és közbeszerzésen át vásárolnak, vagy kicsik és alacsony fizetőképességűek, vagy (az ingatlanirodáknál) a franchise-központok birtokolják az eszközöket. Az autósiskolákra csak 2020-as adat volt ([Pénzcentrum 2020](https://www.penzcentrum.hu/vallalkozas/20200210/egyre-kevesebb-az-autosiskola-magyarorszagon-mi-tortent-itt-1088483)), a magániskolákra és -óvodákra semmilyen adat, ezért ezek pontszáma bizonytalan.

## Mit nem tudunk még, és mi ellenőrizendő elsőként

A legnagyobb hiány a **megyei cégszámok** hiánya: a KSH TEÁOR-szerinti megyei táblái (gsz0075/gsz0074) nem voltak elérhetők, így sem a Csongrád-Csanád megyei vámügynökségek, szállítmányozók, szövetkezetek, generálkivitelezők, sem a szegedi magánklinikák száma nem ismert. Ezt az OPTEN-ből vagy a KSH-ból kézzel kell lekérni a releváns TEÁOR-kódokra (például 4941, 5229, 4120/4399, 0113/1039, 8623, 6920, 7810/7820), mielőtt bármelyik vertikumra árbevétel-tervet építenének. A második hiány a **fizetési hajlandóság**: minden havidíjsáv saját becslés, interjú nem támasztja alá. A harmadik a technikai belépés: nem tudjuk, milyen feltételekkel lehet az eVÁM-hoz, az e-építési naplóhoz vagy a praxisszoftverekhez programozottan csatlakozni, ami a fejlesztő első műszaki feladata. Negyedikként a vendégmunkás-szabályozás iránya a 2026-os kormányváltás után sem rendeződött, és a BYD ütemezése is ellentmondásos a források között.

Az öt validációs lépés egymásra épülő sorrendben is futtatható úgy, hogy az értékesítő egyetlen negyedévben végigvigye őket:

| Hét | Vertikum | Lépés | Sikerkritérium |
|---|---|---|---|
| 1-4 | Bérszámfejtés | 5 bérszámfejtési kérdés beépítése a könyvelői interjúkba | Legalább 3 iroda azonos fájdalmat nevez meg |
| 2-6 | Vám, szállítmányozás | 5 interjú + 20-30 anonimizált dokumentumcsomag, kétheti kinyerési teszt | Legalább 80% mezőpontosság, 2 pilot-szándéknyilatkozat |
| 3-8 | Építőipar | 5-8 interjú, egy nap egy építésvezető mellett, kétheti e-napló tervezet-teszt | 1 fizetett pilot havi 150 ezer Ft felett |
| 4-8 | Fogászat | 5 klinika: szoftver, API, el nem fogadott kezelési tervek értéke; szoftvergyártói partnerprogramok | Klinikánként milliós nagyságrendű kiesés, 1 sikerdíjas pilot |
| 6-12 | Agrár | Szezonon kívüli interjú egy szövetkezettel és 2-3 szaktanácsadóval, egy folyamat munkaóra-térképe | 1 pilot a 2027-es szezon előtt, 1 agrárszakmai partner |
| 12 | Mind | Go/no-go: legfeljebb két vertikum a könyvelői mellé | Legalább 3 aláírt pilot vagy szándéknyilatkozat összesen |

## Konklúzió

A kutatás legfontosabb új felismerése, hogy a szegedi Kft második vertikumának kiválasztásakor **nem az a döntő kérdés, hol a legnagyobb a piac, hanem hol van a legrövidebb fizikai és kapcsolati távolság egy mérhető, magyar szabályhoz kötött kárhoz**. Az építőipar országosan nagyobb, a fogászat fizetőképesebb, de a röszkei határon egy rosszul kitöltött nyilatkozat órákban és kamionnapokban azonnal beárazható veszteség, és ezt csak az tudja közelről kiszolgálni, aki a határtól húsz percre ül, és szerbül is el tud intézni egy telefont. A második felismerés, hogy a nyertes vertikumokban a vevő jellemzően **aggregátor**: szövetkezet, amely száz gazdát lát, generálkivitelező, amely egy egész alvállalkozói láncot, vámügynökség, amely több tucat fuvarozót. Ez ugyanaz a csatornalogika, amely a könyvelőirodát vonzóvá tette, és ez teszi lehetővé, hogy egy kétfős cég egy-egy aláírással sok végfelhasználóhoz jusson el.

Előretekintve a 2026-27-es időablak kétféle módon zárul be. A szoftvergyártók ott, ahol már jelen vannak (fogászat, társasház, könyvelés), egy-két éven belül beépítik a generikus AI-funkciókat, ezért ott csak partnerként érdemes belépni. Ahol viszont az inkumbens ERP vagy egyáltalán nincs szoftver (vámügyi dokumentumok, szövetkezeti háttériroda, e-napló), az elsőként referenciát szerző integrátor évekre megtarthatja a pozícióját. Ezért a sorrendben nem a leggyorsabb bevétel, hanem **a legkevésbé védett, de legmélyebben magyar rendszerekhez kötött munkafolyamat** a stratégiai cél. A bérszámfejtés és az AI-jártassági képzés közben fedezi a működést.
